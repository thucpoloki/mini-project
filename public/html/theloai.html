<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Store - Thể loại sách</title>
    <link rel="icon" type="image/png" href="../../public/t-logo.png">
    
    <!-- Load CSS files -->
    <link rel="stylesheet" href="../../lib/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../public/css/header.css">
    <link rel="stylesheet" href="../../public/css/footer.css">
    <link rel="stylesheet" href="../../public/css/cart.css">
    <link rel="stylesheet" href="../../public/css/TrangChu.css">
    <link rel="stylesheet" href="../../public/css/theloai.css">
    
    <!-- Load JavaScript files -->
    <script src="../../public/js/header.js"></script>
    <script src="../../public/js/footer.js"></script>
    <script src="../../public/js/cart.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- Navigation Menu -->
        <div id="nav-menu">
            <!-- Nội dung menu điều hướng sẽ được chèn vào đây bởi header.js -->
        </div>
        
        <!-- Genre Header -->
        <div class="genre-header">
            <div class="container">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/trangchu">Trang chủ</a></li>
                        <li class="breadcrumb-item active" aria-current="page" id="genre-breadcrumb">Thể loại</li>
                    </ol>
                </nav>
                <h1 class="mb-0" id="genre-title">
                    <i class="fas fa-book me-3"></i>
                    Thể loại sách
                </h1>
                <p class="mb-0 mt-2 opacity-75" id="genre-description">
                    Khám phá kho tàng sách phong phú của chúng tôi
                </p>
            </div>
        </div>
        
        <!-- Filters and Sorting -->
        <div class="container my-4 filter-container" id="filter-container" style="display: none;">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="d-flex align-items-center">
                        <label for="sortSelect" class="form-label me-3 mb-0 fw-semibold text-white">Sắp xếp:</label>
                        <select class="form-select sort-select" id="sortSelect" style="width: auto; min-width: 200px;">
                            <option value="default">Mặc định</option>
                            <option value="name-asc">Tên A-Z</option>
                            <option value="name-desc">Tên Z-A</option>
                            <option value="price-asc">Giá thấp đến cao</option>
                            <option value="price-desc">Giá cao đến thấp</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="d-flex justify-content-end">
                        <span class="books-count" id="books-count">0 sản phẩm</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Books Container -->
        <div id="books-container" class="container my-5">
            <!-- Nội dung sách sẽ được tải vào đây bởi JavaScript -->
            <div class="loading-container">
                <div class="text-center">
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <p class="text-muted">Đang tải danh sách sách...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer>
        <!-- Footer content sẽ được chèn vào đây bởi footer.js -->
    </footer>
    
    <!-- Load theloai.js sau khi DOM ready -->
    <script src="../../public/js/theloai.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="../../lib/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
